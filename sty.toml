[analysis]
strict-generic-narrowing = true
require-valid-suppressions = true

[type-interfaces]
"cc/cc_toolchain_config_lib.bzl" = "cc/cc_toolchain_config_lib.bzli"

"cc/toolchains/cc_toolchain_info.bzl" = "cc/toolchains/cc_toolchain_info.bzli"
"cc/toolchains/directory_tool.bzl" = "cc/toolchains/directory_tool.bzli"
"cc/toolchains/impl/legacy_converter.bzl" = "cc/toolchains/impl/legacy_converter.bzli"

"cc/toolchains/impl/collect.bzl" = "cc/toolchains/impl/collect.bzli"
"cc/toolchains/impl/nested_args.bzl" = "cc/toolchains/impl/nested_args.bzli"
"cc/toolchains/impl/label_utils.bzl" = "cc/toolchains/impl/label_utils.bzli"
"cc/toolchains/nested_args.bzl" = "cc/toolchains/nested_args.bzli"
"cc/toolchains/tool.bzl" = "cc/toolchains/tool.bzli"
"cc/toolchains/tool_map.bzl" = "cc/toolchains/tool_map.bzli"

[rules]
missing-parameter-annotation = "error"
missing-return-annotation = "error"
missing-type-argument = "error"
unsound-assignment = "error"
unsound-return-statement = "error"
explicit-any = "error"
non-static-type = "error"
blanket-ignore-comment = "error"
possibly-unresolved-reference = "error"
possibly-missing-attribute = "error"
division-by-zero = "error"

[[stub-packages]]
manifest = "@bazel_skylib//:stubs.toml"
