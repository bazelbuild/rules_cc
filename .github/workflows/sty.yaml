name: Starlark types

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sty:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: tamird/sty@15120ea73388bb93f0d72b1a5f4c0b5e4117d7f9
        with:
          audit-loads: true
          bazel-version: '9.3.0'
          files: |
            cc/cc_toolchain_config_lib.bzl
            cc/toolchains/cc_toolchain_info.bzl
            cc/toolchains/impl/collect.bzl
            cc/toolchains/impl/label_utils.bzl
            cc/toolchains/impl/legacy_converter.bzl
            cc/toolchains/impl/nested_args.bzl
            cc/toolchains/tool.bzl
            cc/toolchains/tool_map.bzl
