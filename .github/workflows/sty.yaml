name: Starlark types

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sty:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: tamird/sty@3e6e9b0b54ce2455218b7634b9b89197f701041a
        with:
          audit-loads: true
          bazel-version: '9.3.0'
          files: |
            cc/private/paths.bzl
            cc/toolchains/actions.bzl
            cc/toolchains/args_list.bzl
            cc/toolchains/artifacts.bzl
            cc/toolchains/feature.bzl
            cc/toolchains/feature_constraint.bzl
            cc/toolchains/feature_set.bzl
            cc/toolchains/impl/cc_artifact_category.bzl
            cc/toolchains/impl/external_feature.bzl
            cc/toolchains/impl/libc_version.bzl
            cc/toolchains/impl/markdown_helpers.bzl
            cc/toolchains/legacy_tool.bzl
            cc/toolchains/make_variable.bzl
            cc/toolchains/tool_capability.bzl
